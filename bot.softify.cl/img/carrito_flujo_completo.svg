<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="900" height="400" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Flujo del Sistema de Recuperación de Carritos</text>
  <text x="450" y="48" text-anchor="middle" font-size="13" fill="#64748b">Shopify → Cron → WhatsApp → Klaviyo → AI</text>

  <!-- ===== TOP ROW: 6 steps ===== -->

  <!-- Step 1: Shopify Checkout -->
  <rect x="28" y="75" width="128" height="70" rx="8" fill="#7c3aed"/>
  <text x="92" y="98" text-anchor="middle" font-size="12" fill="white" font-weight="bold">① Cliente abandona</text>
  <text x="92" y="116" text-anchor="middle" font-size="11" fill="#e9d5ff">Checkout en Shopify</text>
  <text x="92" y="134" text-anchor="middle" font-size="10" fill="#c4b5fd">con teléfono válido</text>

  <line x1="156" y1="110" x2="185" y2="110" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 2: Cron -->
  <rect x="188" y="75" width="128" height="70" rx="8" fill="#6366f1"/>
  <text x="252" y="98" text-anchor="middle" font-size="12" fill="white" font-weight="bold">② Sistema revisa</text>
  <text x="252" y="116" text-anchor="middle" font-size="11" fill="#c7d2fe">Cada 60 min</text>
  <text x="252" y="134" text-anchor="middle" font-size="10" fill="#a5b4fc">10:00-22:00 hrs</text>

  <line x1="316" y1="110" x2="345" y2="110" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 3: Filter candidates -->
  <rect x="348" y="75" width="128" height="70" rx="8" fill="#0ea5e9"/>
  <text x="412" y="98" text-anchor="middle" font-size="12" fill="white" font-weight="bold">③ Filtra candidatos</text>
  <text x="412" y="116" text-anchor="middle" font-size="11" fill="#bae6fd">Últimos 7 días</text>
  <text x="412" y="134" text-anchor="middle" font-size="10" fill="#7dd3fc">Espera mín: 45 min</text>

  <line x1="476" y1="110" x2="505" y2="110" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 4: Send WA -->
  <rect x="508" y="75" width="128" height="70" rx="8" fill="#25D366"/>
  <text x="572" y="98" text-anchor="middle" font-size="12" fill="white" font-weight="bold">④ Envía WhatsApp</text>
  <text x="572" y="116" text-anchor="middle" font-size="11" fill="#dcfce7">Template con nombre</text>
  <text x="572" y="134" text-anchor="middle" font-size="10" fill="#bbf7d0">+ link al checkout</text>

  <line x1="636" y1="110" x2="665" y2="110" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 5: Mark Klaviyo -->
  <rect x="668" y="75" width="128" height="70" rx="8" fill="#f59e0b"/>
  <text x="732" y="98" text-anchor="middle" font-size="12" fill="white" font-weight="bold">⑤ Marca Klaviyo</text>
  <text x="732" y="116" text-anchor="middle" font-size="11" fill="#fef3c7">wa_carrito_</text>
  <text x="732" y="134" text-anchor="middle" font-size="10" fill="#fde68a">enviado_at</text>

  <line x1="796" y1="110" x2="825" y2="110" stroke="#555" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 6: AI Bot -->
  <rect x="828" y="75" width="55" height="70" rx="8" fill="#10b981"/>
  <text x="855" y="98" text-anchor="middle" font-size="11" fill="white" font-weight="bold">⑥ Bot</text>
  <text x="855" y="116" text-anchor="middle" font-size="10" fill="#d1fae5">responde</text>
  <text x="855" y="134" text-anchor="middle" font-size="10" fill="#a7f3d0">con IA</text>

  <!-- ===== MIDDLE: Dual path flow ===== -->

  <!-- Divider text -->
  <text x="450" y="178" text-anchor="middle" font-size="12" fill="#64748b">Cuando el cliente recibe el mensaje de WhatsApp:</text>

  <!-- Left path: Cliente responde -->
  <rect x="140" y="200" width="260" height="55" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="270" y="222" text-anchor="middle" font-size="13" fill="#065f46" font-weight="bold">El cliente responde al mensaje</text>
  <text x="270" y="242" text-anchor="middle" font-size="11" fill="#047857">"¿es bueno para piel grasa?"</text>

  <!-- Arrow down left -->
  <line x1="270" y1="255" x2="270" y2="300" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Left result: AI context -->
  <rect x="140" y="305" width="260" height="75" rx="8" fill="#d1fae5" stroke="#10b981"/>
  <text x="270" y="325" text-anchor="middle" font-size="12" fill="#065f46" font-weight="bold">🤖 Bot responde con contexto</text>
  <text x="270" y="344" text-anchor="middle" font-size="10" fill="#047857">Sabe qué productos dejó</text>
  <text x="270" y="360" text-anchor="middle" font-size="10" fill="#047857">Precio, variante, cantidad</text>
  <text x="270" y="376" text-anchor="middle" font-size="10" fill="#047857">No pregunta "¿de qué producto hablas?"</text>

  <!-- Right path: Cliente compra -->
  <rect x="500" y="200" width="260" height="55" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="630" y="222" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="bold">El cliente completa la compra</text>
  <text x="630" y="242" text-anchor="middle" font-size="11" fill="#b91c1c">desde el link del mensaje</text>

  <!-- Arrow down right -->
  <line x1="630" y1="255" x2="630" y2="300" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right result: Klaviyo split -->
  <rect x="500" y="305" width="260" height="75" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="630" y="325" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">Klaviyo: Conditional Split</text>
  <text x="630" y="344" text-anchor="middle" font-size="10" fill="#b91c1c">Detecta wa_carrito_enviado_at</text>
  <text x="630" y="360" text-anchor="middle" font-size="10" fill="#b91c1c">Rama SÍ → salta Email #1</text>
  <text x="630" y="376" text-anchor="middle" font-size="10" fill="#b91c1c">Sigue con Email #2 a las 24h</text>

  <!-- Redis + dedup note -->
  <rect x="310" y="290" width="280" height="38" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="450" y="307" text-anchor="middle" font-size="10" fill="#475569">Redis (TTL 30 días): máximo 1 mensaje por cliente</text>
  <text x="450" y="322" text-anchor="middle" font-size="10" fill="#475569">Rate limit Meta: 1.2s entre envíos</text>

</svg>
