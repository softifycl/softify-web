<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Cómo el Bot Responde con Contexto del Carrito</text>

  <!-- LEFT: Customer side -->
  <text x="200" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Lo que ve el cliente</text>

  <!-- Phone mockup -->
  <rect x="100" y="75" width="200" height="290" rx="16" fill="#1e293b"/>
  <rect x="112" y="90" width="176" height="260" rx="8" fill="white"/>

  <!-- WA message received -->
  <rect x="122" y="100" width="156" height="52" rx="8" fill="#e8f5e9"/>
  <text x="130" y="118" font-size="10" fill="#1b5e20" font-weight="bold">Yeppo</text>
  <text x="130" y="132" font-size="9" fill="#2e7d32">¡Hola Alejandro! 👋</text>
  <text x="130" y="145" font-size="9" fill="#2e7d32">Dejaste productos en</text>
  <text x="130" y="158" font-size="9" fill="#2e7d32">tu carrito 🛒  → Comprar</text>

  <!-- Customer reply -->
  <rect x="140" y="162" width="138" height="36" rx="8" fill="#dcf8c6"/>
  <text x="148" y="180" font-size="9" fill="#075e54">Ese sérum es bueno</text>
  <text x="148" y="193" font-size="9" fill="#075e54">para piel grasa?</text>

  <!-- Bot reply with knowledge -->
  <rect x="122" y="208" width="156" height="60" rx="8" fill="#e8f5e9"/>
  <text x="130" y="224" font-size="10" fill="#1b5e20" font-weight="bold">Yeppo</text>
  <text x="130" y="238" font-size="9" fill="#2e7d32">¡Sí! El Sérum</text>
  <text x="130" y="251" font-size="9" fill="#2e7d32">Niacinamida 10% es</text>
  <text x="130" y="264" font-size="9" fill="#2e7d32">ideal para piel grasa.</text>
  <text x="130" y="277" font-size="9" fill="#2e7d32">Regula el sebo y</text>
  <text x="130" y="290" font-size="9" fill="#2e7d32">minimiza poros 👌</text>

  <!-- Customer reply 2 -->
  <rect x="140" y="278" width="138" height="24" rx="8" fill="#dcf8c6"/>
  <text x="148" y="295" font-size="9" fill="#075e54">Gracias! Lo compro</text>

  <!-- Bot context line -->
  <rect x="122" y="312" width="156" height="22" rx="8" fill="#fef3c7"/>
  <text x="200" y="327" text-anchor="middle" font-size="8" fill="#92400e">Sabe que es el Sérum</text>

  <text x="200" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#10b981">✅ Sin preguntar "¿de qué</text>
  <text x="200" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#10b981">producto hablas?"</text>

  <!-- Arrow from left to right -->
  <line x1="300" y1="220" x2="355" y2="220" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RIGHT: What the AI sees -->
  <text x="540" y="60" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">Lo que recibe la IA</text>

  <!-- Code block -->
  <rect x="360" y="75" width="380" height="250" rx="8" fill="#1e293b"/>
  
  <!-- System prompt section -->
  <text x="378" y="98" font-size="11" fill="#94a3b8" font-family="Courier New, monospace">SYSTEM PROMPT adicional:</text>

  <text x="378" y="120" font-size="11" fill="#fbbf24" font-family="Courier New, monospace">## Contexto: Recuperación</text>
  <text x="378" y="138" font-size="11" fill="#fbbf24" font-family="Courier New, monospace">## de carrito abandonado</text>

  <text x="378" y="162" font-size="11" fill="#e2e8f0" font-family="Courier New, monospace">El cliente recibió un</text>
  <text x="378" y="180" font-size="11" fill="#e2e8f0" font-family="Courier New, monospace">mensaje de WhatsApp hace</text>
  <text x="378" y="198" font-size="11" fill="#e2e8f0" font-family="Courier New, monospace">menos de 48h.</text>

  <text x="378" y="222" font-size="11" fill="#4ade80" font-family="Courier New, monospace">Productos en su carrito:</text>
  <text x="378" y="240" font-size="11" fill="#e2e8f0" font-family="Courier New, monospace">- Sérum Niacinamida 10%</text>
  <text x="378" y="256" font-size="11" fill="#e2e8f0" font-family="Courier New, monospace">  (30ml) x1 — $12.990</text>
  <text x="378" y="274" font-size="11" fill="#e2e8f0" font-family="Courier New, monospace">- Protector Solar</text>
  <text x="378" y="292" font-size="11" fill="#e2e8f0" font-family="Courier New, monospace">  (50ml) x2 — $8.990</text>

  <text x="378" y="316" font-size="11" fill="#4ade80" font-family="Courier New, monospace">Total: $30.970</text>

  <!-- Highlight box -->
  <rect x="370" y="330" width="360" height="30" rx="4" fill="none" stroke="#4ade80" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="550" y="350" text-anchor="middle" font-size="10" fill="#4ade80">↑ La IA usa estos datos para responder ↑</text>

  <!-- Bottom: data source -->
  <rect x="360" y="370" width="380" height="45" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="550" y="390" text-anchor="middle" font-size="11" fill="#475569" font-weight="bold">Origen de los datos</text>
  <text x="550" y="406" text-anchor="middle" font-size="10" fill="#64748b">Shopify Checkout API → line_items → Redis → Prompt del Bot</text>

</svg>
