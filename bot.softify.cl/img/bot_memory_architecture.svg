<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="redis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DC382D"/>
      <stop offset="1" stop-color="#a82a22"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="summ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="whisper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <rect width="900" height="520" fill="#f8fafc" rx="10"/>
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">Sistema de Memoria y Contexto del Bot — Arquitectura Completa</text>

  <!-- ── Caja 1: Entrada del mensaje ── -->
  <rect x="20" y="50" width="190" height="60" rx="8" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">📱 Mensaje Entrante</text>
  <text x="115" y="92" text-anchor="middle" font-size="10" fill="#64748b">Texto / Audio / Imagen</text>

  <!-- ── Caja 2: Memoria Redis ── -->
  <rect x="350" y="50" width="200" height="160" rx="8" fill="url(#redis)" filter="url(#shadow)"/>
  <text x="450" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🧠 Redis Memory</text>
  <line x1="370" y1="82" x2="530" y2="82" stroke="rgba(255,255,255,0.3)"/>
  <text x="450" y="102" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.95)">context:{phone}</text>
  <text x="450" y="118" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">├ name, orderNumber</text>
  <text x="450" y="134" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">├ skinType, preocupaciones</text>
  <text x="450" y="150" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">├ summary (resumen conversación)</text>
  <text x="450" y="166" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">├ campaignCtx (carrito/campaña)</text>
  <text x="450" y="182" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">├ TTL: NONE (infinito)</text>
  <text x="450" y="198" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.8)">└ history: últimos N mensajes</text>

  <!-- ── Caja 3: Historial completo ── -->
  <rect x="20" y="140" width="190" height="70" rx="8" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="115" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">📜 Historial Redis</text>
  <text x="115" y="182" text-anchor="middle" font-size="10" fill="#64748b">history:{phone}</text>
  <text x="115" y="198" text-anchor="middle" font-size="9" fill="#94a3b8">Lista de mensajes completa</text>

  <!-- ── Caja 4: Resumen Progresivo ── -->
  <rect x="20" y="240" width="190" height="80" rx="8" fill="url(#summ)" filter="url(#shadow)"/>
  <text x="115" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="white">✂️ Progressive Summarizer</text>
  <line x1="40" y1="270" x2="190" y2="270" stroke="rgba(255,255,255,0.3)"/>
  <text x="115" y="288" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.95)">Cada ~10 mensajes → resume</text>
  <text x="115" y="304" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.85)">Guarda en context.summary</text>

  <!-- ── Caja 5: Construcción del Prompt ── -->
  <rect x="350" y="260" width="200" height="100" rx="8" fill="url(#prompt)" filter="url(#shadow)"/>
  <text x="450" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🏗️ buildSystemPrompt()</text>
  <line x1="370" y1="292" x2="530" y2="292" stroke="rgba(255,255,255,0.3)"/>
  <text x="450" y="312" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.95)">1. prompt.md base</text>
  <text x="450" y="328" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.95)">2. knowledge_doc.md</text>
  <text x="450" y="344" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.95)">3. learned_faqs.json</text>

  <!-- ── Caja 6: Enriquecimiento ── -->
  <rect x="620" y="260" width="260" height="100" rx="8" fill="white" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="750" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">✨ Prompt Enrichment</text>
  <text x="750" y="305" text-anchor="middle" font-size="9" fill="#475569">+ Contexto cliente (name, skin, order)</text>
  <text x="750" y="322" text-anchor="middle" font-size="9" fill="#475569">+ Summary (resumen conversaciones previas)</text>
  <text x="750" y="339" text-anchor="middle" font-size="9" fill="#475569">+ Catálogo Shopify (searchCatalog)</text>
  <text x="750" y="356" text-anchor="middle" font-size="9" fill="#475569">+ Campaign context (carrito/vip)</text>

  <!-- ── Caja 7: AI ── -->
  <rect x="620" y="420" width="260" height="80" rx="8" fill="url(#ai)" filter="url(#shadow)"/>
  <text x="750" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🤖 DeepSeek / Claude</text>
  <line x1="640" y1="452" x2="860" y2="452" stroke="rgba(255,255,255,0.3)"/>
  <text x="750" y="472" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.95)">Recibe: system prompt + history + user msg</text>
  <text x="750" y="490" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.95)">Responde con conciencia de TODO el contexto</text>

  <!-- ── Caja 8: Audio ── -->
  <rect x="20" y="380" width="190" height="55" rx="8" fill="url(#whisper)" filter="url(#shadow)"/>
  <text x="115" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="white">🎤 Whisper Transcriber</text>
  <text x="115" y="420" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">WhatsApp + IG + Messenger</text>

  <!-- ── Caja 9: Post-procesamiento ── -->
  <rect x="350" y="410" width="200" height="55" rx="8" fill="white" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">📝 Post-Reply</text>
  <text x="450" y="450" text-anchor="middle" font-size="9" fill="#64748b">Detectar HANDOFF / guardar summary</text>

  <!-- ── FLECHAS ── -->
  <!-- msg → redis -->
  <line x1="210" y1="80" x2="345" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <!-- history → redis -->
  <line x1="210" y1="175" x2="345" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <!-- msg → summarizer -->
  <line x1="210" y1="175" x2="210" y2="280" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- summarizer → context -->
  <line x1="210" y1="280" x2="345" y2="280" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <!-- redis context → buildPrompt -->
  <line x1="450" y1="210" x2="450" y2="255" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <!-- buildPrompt → enrichment -->
  <line x1="550" y1="300" x2="615" y2="300" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>
  <!-- enrichment → AI -->
  <line x1="750" y1="360" x2="750" y2="415" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>
  <!-- audio → msg -->
  <line x1="115" y1="380" x2="115" y2="310" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- post → summarizer -->
  <line x1="350" y1="437" x2="215" y2="310" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6366f1"/>
    </marker>
  </defs>
</svg>
